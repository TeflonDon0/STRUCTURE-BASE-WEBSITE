services:
  - type: web
    name: structurebase
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: waitress-serve --listen=0.0.0.0:$PORT wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: STRUCTUREBASE_SECRET
        generateValue: true
      - key: STRUCTUREBASE_ENV
        value: production
      - key: STRUCTUREBASE_STRICT_STARTUP_CHECKS
        value: "1"
      - key: STRUCTUREBASE_TRUST_PROXY_COUNT
        value: "1"
      - key: STRUCTUREBASE_LOG_LEVEL
        value: INFO
      - key: STRUCTUREBASE_DATABASE_BACKEND
        value: mongodb
      - key: STRUCTUREBASE_STORAGE_BACKEND
        value: cloudinary
      - key: STRUCTUREBASE_MONGODB_URI
        sync: false
      - key: STRUCTUREBASE_MONGODB_DB_NAME
        value: structurebase
      - key: STRUCTUREBASE_MONGODB_COLLECTION
        value: listings
      - key: STRUCTUREBASE_MONGODB_ENQUIRIES_COLLECTION
        value: enquiries
      - key: STRUCTUREBASE_MONGODB_CONTACTS_COLLECTION
        value: contacts
      - key: STRUCTUREBASE_MONGODB_LEAD_NOTES_COLLECTION
        value: lead_notes
      - key: STRUCTUREBASE_MONGODB_INSPECTIONS_COLLECTION
        value: inspections
      - key: STRUCTUREBASE_MONGODB_MAINTENANCE_COLLECTION
        value: maintenance_tickets
      - key: STRUCTUREBASE_MONGODB_FINANCIAL_COLLECTION
        value: financial_records
      - key: STRUCTUREBASE_MONGODB_DOCUMENT_COLLECTION
        value: documents
      - key: STRUCTUREBASE_MONGODB_SETTINGS_COLLECTION
        value: site_preferences
      - key: STRUCTUREBASE_MONGODB_PARTNERS_COLLECTION
        value: partners
      - key: STRUCTUREBASE_MONGODB_REFERRALS_COLLECTION
        value: referrals
      - key: STRUCTUREBASE_MONGODB_REFERRAL_EVENTS_COLLECTION
        value: referral_events
      - key: STRUCTUREBASE_REFERRAL_ATTRIBUTION_DAYS
        value: "30"
      - key: STRUCTUREBASE_MONGODB_COMMISSION_RULES_COLLECTION
        value: commission_rules
      - key: STRUCTUREBASE_MONGODB_COMMISSIONS_COLLECTION
        value: commissions
      - key: STRUCTUREBASE_MONGODB_MARKETING_ASSETS_COLLECTION
        value: marketing_assets
      - key: STRUCTUREBASE_MONGODB_PARTNER_MARKETING_EVENTS_COLLECTION
        value: partner_marketing_events
      - key: STRUCTUREBASE_MONGODB_ACTIVITY_COLLECTION
        value: activity_log
      - key: STRUCTUREBASE_MONGODB_STAFF_COLLECTION
        value: staff_users
      - key: STRUCTUREBASE_MONGODB_STAFF_INVITATIONS_COLLECTION
        value: staff_invitations
      - key: STRUCTUREBASE_MONGODB_LOGIN_ATTEMPTS_COLLECTION
        value: staff_login_attempts
      - key: CLOUDINARY_URL
        sync: false
      - key: STRUCTUREBASE_CLOUDINARY_FOLDER
        value: structurebase/listings
      - key: STRUCTUREBASE_CLOUDINARY_CLOUD_NAME
        sync: false
      - key: STRUCTUREBASE_CLOUDINARY_API_KEY
        sync: false
      - key: STRUCTUREBASE_CLOUDINARY_API_SECRET
        sync: false
      - key: STRUCTUREBASE_ADMIN_USERNAME
        sync: false
      - key: STRUCTUREBASE_ADMIN_PASSWORD
        sync: false
      - key: STRUCTUREBASE_INITIAL_ADMIN_NAME
        value: Structurebase Owner
      - key: STRUCTUREBASE_INITIAL_ADMIN_EMAIL
        sync: false
      - key: STRUCTUREBASE_STAFF_INVITATION_HOURS
        value: "48"
      - key: STRUCTUREBASE_SESSION_COOKIE_SECURE
        value: "1"
      - key: STRUCTUREBASE_SESSION_HOURS
        value: "12"
      - key: STRUCTUREBASE_LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: STRUCTUREBASE_LOGIN_WINDOW_MINUTES
        value: "15"
      - key: STRUCTUREBASE_CONTACT_EMAIL
        sync: false
      - key: STRUCTUREBASE_CONTACT_PHONE
        sync: false
      - key: STRUCTUREBASE_CONTACT_PHONE_RAW
        sync: false
      - key: STRUCTUREBASE_WHATSAPP_PHONE
        sync: false
      - key: STRUCTUREBASE_SITE_NAME
        value: Structurebase
      - key: STRUCTUREBASE_PUBLIC_BASE_URL
        sync: false
      - key: STRUCTUREBASE_SEARCH_INDEXING_ENABLED
        value: "0"
      - key: STRUCTUREBASE_OFFICE_ADDRESS
        value: Lagos, Nigeria
      - key: STRUCTUREBASE_COVERAGE_AREA
        value: Lagos, Abuja, Port Harcourt, and selected markets across Nigeria
      - key: STRUCTUREBASE_FOOTER_SUMMARY
        value: Property listings, enquiries, and operations support from a team based in Lagos and active across Nigeria.
